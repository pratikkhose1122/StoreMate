name: storemate
description: "StoreMate - Smart Inventory & Billing for Indian Retailers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0

  # Supabase
  supabase_flutter: ^2.8.4

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # UI Components
  pinput: ^5.0.1
  google_fonts: ^6.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  mobile_scanner: ^7.2.0
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  timeago: ^3.7.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_blue_plus: ^2.3.9
  esc_pos_utils_plus: ^2.0.4
  url_launcher: ^6.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1

  # Product Identification
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_object_detection: ^0.13.0
  crypto: ^3.0.6
  image: ^4.1.7
  camera: ^0.12.0+2
  uuid: ^4.6.0
  decimal: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/dictionaries/
